[project]
name = "meteosynth"
version = "0.3.2"
description = "A package for generating synthetic environmental time-series using Markov Chain models and PVGIS data integration."
readme = "README.md"
authors = [
    { name = "N.Papadakis (hmuQ)", email = "npap@hmu.gr" }
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

dependencies = [
    "numpy>=1.22.0",
    "pandas>=1.4.0",
    "scipy>=1.8.0",
    "pvlib>=0.9.0",
    # matplotlib is imported unconditionally by the core simulator modules
    # (plotting helpers are first-class methods), so it is a hard dependency.
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "tqdm>=4.66.0", # Progress bars for the long-running generation loops.
    "pyarrow>=25.0.0",
]

[project.optional-dependencies]
# Excel export of an ensemble (`meteosynth.ensemble_to_xlsx`). Not a core dependency: the
# canonical ensemble format is parquet, which needs nothing beyond the required pyarrow.
# Install with:  uv sync --extra excel   (or  pip install meteosynth[excel])
excel = [
    "openpyxl>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/npapnet/meteosynth"
Repository = "https://github.com/npapnet/meteosynth.git"
Documentation = "https://meteosynth-docs.npapnet-cloudflare.workers.dev"
# Documentation = "https://meteosynth.pages.dev"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    # Documentation toolchain (Sphinx + furo theme + Mermaid + Markdown support)
    "sphinx>=6.0.0",
    "furo>=2023.0.0",
    "sphinxcontrib-mermaid>=0.9.2",
    "myst-parser>=2.0.0",
    # Interactive / notebook workflow (VS Code, Jupyter, etc.)
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "ipykernel>=6.0.0",
]
